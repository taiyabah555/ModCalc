
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ModCalc - A fast modular arithmetic calculator for students.">
    <title>ModCalc | Modular Arithmetic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">Mod<span>Calc</span></div>
        <p>Modular Arithmetic Calculator</p>
    </header>

    <main class="container">

        <section class="calculator">
            <h1>Modulo Calculator</h1>
            <p class="subtitle">
                Calculate remainders quickly and accurately.
            </p>

            <div class="input-group">
                <label for="dividend">Dividend (a)</label>
                <input
                    type="text"
                    id="dividend"
                    placeholder="Enter an integer"
                    inputmode="numeric"
                >
            </div>

            <div class="input-group">
                <label for="modulus">Modulus (n)</label>
                <input
                    type="text"
                    id="modulus"
                    placeholder="Enter a positive integer"
                    inputmode="numeric"
                >
            </div>

            <button id="calculateBtn">Calculate Modulo</button>

            <p id="errorMessage" class="error-message" aria-live="polite"></p>

            <section id="resultSection" class="result-section" hidden>
                <p class="result-label">REMAINDER</p>
                <div id="result" class="result">0</div>

                <div class="calculation-details">
                    <h3>Calculation Steps</h3>
                    <p id="quotient"></p>
                    <p id="equation"></p>
                </div>
            </section>

        </section>

    </main>

    <footer>
        <p>ModCalc &copy; 2026 | Open Source Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
